# Vaeloria — Godot 4.6 Android APK build (GitHub Actions).
#
# How it works: runs inside the barichello/godot-ci container (which is
# minimal — the steps below install Python, the export templates, the JDK
# and the Android 34/35 SDK packages), then exports a RELEASE APK from the
# "Android" preset in export_presets.cfg and signs it with the Lynxos
# keystore.
#
# Release signing: the repo needs the 4 secrets (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS=lynxos) — the same values as
# the other Lynxos app repos. The export runs unsigned
# (package/signed=false in the preset), then zipalign + apksigner sign it
# here. Keystore values are never pasted into this file.
#   - Leanback: the game is fully D-pad navigable; enabling the Android TV
#     Leanback launcher entry is an editor preset option to confirm on the
#     first real device test (see BUILD_NOTES.md).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Export Android APK (Godot 4.6)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Python, Pillow, unzip, fontconfig, JDK 17 (the Godot container is minimal)
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pil unzip wget libfontconfig1 openjdk-17-jdk

      - name: Point Godot at the Java SDK (export fails without this editor setting)
        run: |
          JAVA_BIN="$(command -v java || echo /usr/lib/jvm/java-17-openjdk-amd64/bin/java)"
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          test -x "$JAVA_DIR/bin/java"
          echo "JAVA_HOME=$JAVA_DIR" >> $GITHUB_ENV
          echo "Java SDK: $JAVA_DIR"
          mkdir -p ~/.config/godot
          # Let Godot create a valid editor-settings file first, then patch it
          # with a proper gd_resource header (a bare [resource] file is ignored).
          godot --headless --editor --quit || true
          python3 - "$JAVA_DIR" <<'PYEOF'
          import os, re, sys
          java_dir = sys.argv[1]
          path = os.path.expanduser("~/.config/godot/editor_settings-4.6.tres")
          text = open(path).read() if os.path.exists(path) else ""
          if "[gd_resource" not in text:
              text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' + text
          # Godot writes the key as 'export/android/java_sdk_path = ""' (spaces
          # around =), so drop any existing line for the key and append the
          # correct one instead of regex-matching a specific spacing.
          lines = [l for l in text.splitlines() if "export/android/java_sdk_path" not in l]
          lines.append('export/android/java_sdk_path="' + java_dir + '"')
          text = "\n".join(lines) + "\n"
          open(path, "w").write(text)
          print(open(path).read())
          assert 'export/android/java_sdk_path="' + java_dir + '"' in text, "Java SDK path not set!"
          PYEOF
          grep java_sdk_path ~/.config/godot/editor_settings-4.6.tres
          test "$(grep -o 'java_sdk_path="[^"]*"' ~/.config/godot/editor_settings-4.6.tres | cut -d'"' -f2)" != ""

      - name: Install Android export templates (missing from the container)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q -o /tmp/templates.tpz -d ~/.local/share/godot/export_templates/4.6.stable
          mv ~/.local/share/godot/export_templates/4.6.stable/templates/* ~/.local/share/godot/export_templates/4.6.stable/
          ls ~/.local/share/godot/export_templates/4.6.stable/

      # The image ships only build-tools 33.0.2 + platform android-33, but
      # Godot 4.6 targets a newer SDK ("Could not find version of build tools
      # that matches Target SDK, using 33.0.2") and the export then fails its
      # config check with an empty error list. Install 34 and 35 to cover it.
      - name: Install Android 34/35 SDK packages (Godot 4.6 target SDK)
        run: |
          SDKMANAGER="$(find /usr/lib/android-sdk -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"
          ls /usr/lib/android-sdk/build-tools/
          ls /usr/lib/android-sdk/platforms/

      - name: Generate art and sounds (original, programmatic)
        run: python3 assets/generate_assets.py

      - name: Import project (validates scripts and scenes)
        run: godot --headless --import --quit

      - name: Export release APK (unsigned — signing happens in the next step)
        run: |
          mkdir -p build
          godot --headless --verbose --export-release "Android" build/lynxos-rpg-release.apk

      - name: Sign APK with the Lynxos keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER="$(find /usr/lib/android-sdk/build-tools -name apksigner -type f | sort -V | tail -1)"
          ZIPALIGN="$(find /usr/lib/android-sdk/build-tools -name zipalign -type f | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          echo "zipalign: $ZIPALIGN"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN"
          "$ZIPALIGN" -f 4 build/lynxos-rpg-release.apk build/lynxos-rpg-aligned.apk
          mv build/lynxos-rpg-aligned.apk build/lynxos-rpg-release.apk
          "$APKSIGNER" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" build/lynxos-rpg-release.apk
          "$APKSIGNER" verify --verbose build/lynxos-rpg-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lynxos-rpg-apk
          path: build/lynxos-rpg-release.apk
          if-no-files-found: error
